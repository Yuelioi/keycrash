name: macOS attribution fixtures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/macos-owner-query.m
      - scripts/test-macos-owner-query.py
      - scripts/test-macos-owner-events.py
      - .github/workflows/macos-owner-experiment.yml

permissions:
  contents: read

jobs:
  query:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compile isolated native experiment
        run: |
          mkdir -p .task/macos-owner-query
          clang -fobjc-arc -Wall -Wextra -Wno-deprecated-declarations \
            -framework Cocoa -framework Carbon examples/macos-owner-query.m \
            -o .task/macos-owner-query/owner-query
      - name: Compile stable permission host
        run: |
          clang -fobjc-arc -Wall -Wextra -framework Foundation -framework ApplicationServices \
            examples/macos-diagnostics-launcher.m -o .task/macos-owner-query/diagnostics-launcher
      # TCC authorization and registered-hotkey delivery require desktop acceptance.
      # Product Rust backend compilation is covered by macos.yml on both architectures.
