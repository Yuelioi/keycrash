name: macOS owner experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/macos-owner-query.m
      - scripts/test-macos-owner-query.py
      - scripts/test-macos-owner-events.py
      - .github/workflows/macos-owner-experiment.yml

permissions:
  contents: read

jobs:
  query:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compile isolated native experiment
        run: |
          mkdir -p .task/macos-owner-query
          clang -fobjc-arc -Wall -Wextra -Wno-deprecated-declarations \
            -framework Cocoa -framework Carbon examples/macos-owner-query.m \
            -o .task/macos-owner-query/owner-query
      - name: Verify cross-process attribution hypothesis
        run: |
          sw_vers
          python3 scripts/test-macos-owner-query.py .task/macos-owner-query/owner-query
      - name: Verify annotated event target hypothesis
        if: ${{ !cancelled() }}
        run: python3 scripts/test-macos-owner-events.py .task/macos-owner-query/owner-query --trigger-fixture
