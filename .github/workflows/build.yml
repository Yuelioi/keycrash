name: Windows CI

on:
  push:
    branches: ['**']
    paths:
      - "src/**"
      - "native/**"
      - "ui/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain*"
      - "rustfmt.toml"
  pull_request:
    paths:
      - "src/**"
      - "native/**"
      - "ui/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain*"
      - "rustfmt.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
      - name: Test
        run: cargo test --locked --release --workspace --target-dir (./scripts/get-target-root.ps1)
      - name: Check Windows binaries and icon
        run: ./scripts/build-release.ps1
