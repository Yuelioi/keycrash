name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example, v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: stable
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
      - name: Validate version tag
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'keycrash').version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG must match Cargo.toml version v$version"
          }
      - name: Test
        run: cargo test --locked --release --workspace --target-dir (./scripts/get-target-root.ps1)
      - name: Build release and verify icon
        run: ./scripts/build-release.ps1
      - name: Prepare portable bundle
        id: bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path (./scripts/get-target-root.ps1) 'release'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'keycrash').version
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'keycrash-bundle'
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot 'owner-x86') -Force | Out-Null
          foreach ($file in @('keycrash.exe', 'keycrash-owner-probe.exe', 'keycrash_owner_hook.dll', 'owner-x86/keycrash-owner-probe.exe', 'owner-x86/keycrash_owner_hook.dll')) {
            Copy-Item -LiteralPath (Join-Path $releaseRoot $file) -Destination (Join-Path $bundleRoot $file)
          }
          Copy-Item -LiteralPath 'README.md', 'README.en.md', 'README.ja.md' -Destination $bundleRoot
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot 'docs/images') -Force | Out-Null
          Copy-Item -LiteralPath 'docs/images/keycrash-screenshot.png' -Destination (Join-Path $bundleRoot 'docs/images')
          $archive = Join-Path $env:RUNNER_TEMP "keycrash-v$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath $archive -Force
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ARCHIVE: ${{ steps.bundle.outputs.archive }}
        run: |
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, $env:RELEASE_ARCHIVE,
            '--verify-tag', '--title', "KeyCrash $env:RELEASE_TAG", '--generate-notes')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
