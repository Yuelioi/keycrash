name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example, v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: stable
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc
      - name: Validate version tag
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'keycrash').version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG must match Cargo.toml version v$version"
          }
      - name: Test
        run: cargo test --locked --release --workspace --target-dir (./scripts/get-target-root.ps1)
      - name: Build release and verify icon
        run: ./scripts/build-release.ps1
      - name: Prepare portable bundle
        id: bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path (./scripts/get-target-root.ps1) 'release'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'keycrash').version
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE '.task/release/windows-bundle'
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot 'owner-x86') -Force | Out-Null
          foreach ($file in @('keycrash.exe', 'keycrash-owner-probe.exe', 'keycrash_owner_hook.dll', 'owner-x86/keycrash-owner-probe.exe', 'owner-x86/keycrash_owner_hook.dll')) {
            Copy-Item -LiteralPath (Join-Path $releaseRoot $file) -Destination (Join-Path $bundleRoot $file)
          }
          Copy-Item -LiteralPath 'README.md', 'README.en.md', 'README.ja.md' -Destination $bundleRoot
          New-Item -ItemType Directory -Path (Join-Path $bundleRoot 'docs/images') -Force | Out-Null
          Copy-Item -LiteralPath 'docs/images/keycrash-screenshot.png' -Destination (Join-Path $bundleRoot 'docs/images')
          Copy-Item -LiteralPath 'docs/MACOS.md' -Destination (Join-Path $bundleRoot 'docs')
          $archive = Join-Path $env:GITHUB_WORKSPACE ".task/release/keycrash-v$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $bundleRoot '*') -DestinationPath $archive -Force
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: keycrash-windows-x64
          path: ${{ steps.bundle.outputs.archive }}
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: keycrash-*
          merge-multiple: true
          path: dist
      - name: Validate release assets
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          expected = {f"keycrash-{tag}-{platform}.zip" for platform in ["windows-x64", "macos-arm64", "macos-x86_64"]}
          actual = {p.name for p in Path("dist").iterdir()}
          assert actual == expected, (expected, actual)
          assert all(p.stat().st_size > 0 for p in Path("dist").iterdir())
          PY
      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          新增 macOS 全局监听检查，支持选择软件并定位影响快捷键传递的进程。优化定位结果展示、语言切换及取消后的监听恢复。

          - **Mac M 系列**：下载 `macos-arm64.zip`。
          - **Intel Mac**：下载 `macos-x86_64.zip`。
          - **Windows 10 / 11（64 位）**：下载 `windows-x64.zip`，完整解压后运行 `keycrash.exe`。

          Mac 解压后运行 `KeyCrash.app`，首次定位时按提示授予辅助功能权限。定位可能触发快捷键原本的操作；全局监听检查会短暂暂停所选软件的键盘监听，结束或取消后自动恢复。
          EOF
          args=(release create "$RELEASE_TAG" dist/*.zip --draft --verify-tag --title "KeyCrash $RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
