[package]
name = "keycrash"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[workspace]
resolver = "3"
default-members = ["."]
members = [
    ".",
    "native/hotkey-fixture",
    "native/owner-hook",
    "native/owner-probe",
]

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
    "compat-1-2",
] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.17.1"
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
